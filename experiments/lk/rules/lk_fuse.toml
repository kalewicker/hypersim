# lk_fuse.toml — the v4 F2 fuse rule: filament reabsorption. A degree-2,
# generation ≥ 1 midpoint w is removed and its endpoints rejoined; w's
# energy VANISHES with it, recorded per-event on the fused-energy ledger
# (audit: E_total + c·N_sub + Σ E_fused = E₀, exact — v4 §6.3).
#
# Scope (v4 §1.4, pre-declared): gen-0 original lattice edges and planted
# handles are NON-REMOVABLE BY DESIGN — fuse removes only emergent throats.
#
# WHICH guard delivers that (v10 §2.1, G0.1 — corrected): the DEGREE guard,
# not the generation guard. No rule in this family changes any node's
# degree — subdivide preserves endpoint degree, fuse removes a midpoint and
# rejoins its endpoints, transport is topology-inert — so a gen-0 node
# stays at its birth degree (6 on the torus) forever and can never meet
# `degree == 2`. Measured: 0 gen-0 nodes at degree 2 in 19.2M snapshot
# observations. The generation guard below is therefore REDUNDANT; removing
# it alone would admit nothing. Eroding the skeleton needs the DEGREE guard
# relaxed, which is vertex contraction, not a chain-link unzip (v10 §5,
# deferred). See docs/guard_shadow_audit_v10.md.
#
# Anti-churn brake (v4 §7): priority LAST (-1, below transport 0 and
# subdivide 1 in the pump regime; the transport_first remap keeps it at
# -1) — subdivide wins conflicts while eligible, so in the pump regime
# fuse activates only at quench (growth era → reabsorption era). Churn
# (fuse-then-resubdivide at the same site) is MEASURED via the churn
# counter, never silently prevented.
#
# Degree guard semantics (v4 §6.2, pinned): degree = count of distinct
# incident hyperedges. Both guards carry engagement counters from birth
# (§1.1) — FG3 requires the generation guard's rejection counter to be
# nonzero on a clean lattice.
#
# GUARD PRECEDENCE (v10 §1.4): declaration order here is NOT evaluation
# order. `bind_free_vars` chains the guard FAMILIES — property → compares
# → degree → age (matcher.rs) — so the generation guard (a property guard)
# is evaluated FIRST and the degree guard sees only what it admits. With
# f_cap on, prop1 short-circuits ahead of degree too, and the degree guard
# is never evaluated at all. Consequence for reading guards.csv: each
# family's `evals` equals the previous family's `evals − rejects`, and a
# guard's reject count is conditional on every family declared before it.
#
# Age gate (v8 §3.1): `[lk_rules.fuse] gate = "age"` appends
# `node_age_compares w >= lifetime_k` — `(step − birth_step(w)) ≥ k`,
# read from the creation step the store already records on every node.
# Same lifetime semantics as the v6 countdown gate (BG2 pins both
# mechanisms fusing on the same step of the same fixture) with the tick
# rule deleted, so the clock claims no bindings and takes none from the
# physics. NOTE: unlike the countdown guard, this one is NOT a second
# lattice protection — every node has a birth step and gen-0 nodes read
# as maximally OLD. v8 (grammar_audit_v8.md, Q4) concluded from this that
# "the generation guard is what keeps the lattice non-removable; do not
# weaken it" — v10 §2.1 CORRECTS that: the degree guard is, see the scope
# note above. The age gate's lack of lattice protection remains harmless,
# but for a different reason than v8 recorded.
#
# f_cap throttle (v5 §1.3): `[lk_rules.fuse] f_cap` in the run config
# appends Guard `w.energy < f_cap` (STRICT `<`; a node at exactly f_cap
# is not fusable — FG5 pins the boundary) as prop1, after the
# generation guard's prop0. A fresh child carries exactly q, so with
# f_cap < q the guard is an AGING TIMER (t_age ≳ (q − f_cap)/τ). The
# guard is config-injected (runner load_rules), not declared here, so
# an unthrottled file-load of this rule is byte-unchanged from v4.

[[rules]]
name     = "lk_fuse"
priority = -1
weight   = 1.0
enabled  = true

[rules.lhs]
nodes = ["x", "w", "y"]
edges = [
  ["x", "w"],
  ["w", "y"],
]

[[rules.lhs.var_guards]]
type = "vars_distinct"
vars = ["x", "w", "y"]

[[rules.lhs.node_degree_compares]]
var   = "w"
op    = "eq"
value = 2

[[rules.lhs.node_property_guards]]
var      = "w"
property = 6
op       = "gte"
value    = 1.0

[rules.rhs]
nodes = ["x", "y"]
edges = [
  ["x", "y"],
]
