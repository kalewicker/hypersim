# lk_pair.toml — the LK-R rule family as one loadable set: the
# concatenation of lk_metered_subdivide.toml (priority 1) and
# lk_transport.toml (priority 0), which are the two normative files
# (plan v2 §6.1). Keep all three in sync.

# lk_metered_subdivide (LK-R, plan v2 §6.1): dissipative structural
# growth. A node holding at least θ energy subdivides an incident edge
# into a 2-path through a fresh midpoint w; w is endowed with the
# constant quantum q and the parent pays q + c, where c > 0 is the
# per-event sink that bounds the run (boundedness comes from explicit
# dissipation, not conservation — v2 §0).
#
# Audit invariant (v2 §6.2, exact at every window):
#   E_total(t) + c · N_subdivisions(t) = E₀
#
# Constants (Appendix B): θ = 100, q = 50, c = 10 → parent pays 60.
# Integers in f64: sums exact. Keep [lk_rules] c in sync (the audit
# reads the config; drift is flagged, never rationalized).
#
# DEVIATION from the plan's effect list (documented): the plan wrote
# "w.energy add q", but `add` skips when the target key is missing and w
# is created fresh with no properties — `set q` is the semantically
# identical spelling for a fresh node (docs/rule_grammar.md).
#
# Priority 1: PINNED above lk_transport (subdivide before transport,
# v2 §6.1); order-sensitivity is test-pinned.

[[rules]]
name     = "lk_metered_subdivide"
priority = 1
weight   = 1.0
enabled  = true

[rules.lhs]
nodes = ["x", "y"]
edges = [
  ["x", "y"],
]

[[rules.lhs.var_guards]]
type = "vars_distinct"
vars = ["x", "y"]

[[rules.lhs.node_property_guards]]
var      = "x"
property = 1
op       = "gte"
value    = 100.0

[rules.rhs]
nodes = ["x", "w", "y"]
edges = [
  ["x", "w"],
  ["w", "y"],
]

[[rules.rhs.property_effects]]
var   = "w"
key   = 1
op    = "set"
value = 50.0

[[rules.rhs.property_effects]]
var   = "x"
key   = 1
op    = "subtract"
value = 60.0
# lk_transport (LK-R, plan v2 §6.1): exactly conservative energy
# diffusion. Guard x.energy >= y.energy + 2τ (the offset opens a dead
# zone |Δ| < 2τ so transfers never oscillate); effects move exactly τ.
# Deterministic: property comparison only, zero RNG draws. Same-source
# instances conflict on the shared bound node and serialize under the
# deterministic tie-break — one transfer per node per step (documented,
# not fought).
#
# Constants (Appendix B): τ = 25.0, so offset = 2τ = 50.0. All constants
# are integers in f64 — sums stay exact, which the §6.2 audit invariant
# requires. If you change τ here, update [lk_rules] tau (the audit reads
# the config; disagreement shows up as audit_invariant_drift — loudly).
#
# Priority 0: PINNED below lk_metered_subdivide (priority 1). Where both
# match the same edge, subdivision wins deterministically (v2 §6.1);
# order-sensitivity is test-pinned.

[[rules]]
name     = "lk_transport"
priority = 0
weight   = 1.0
enabled  = true

[rules.lhs]
nodes = ["x", "y"]
edges = [
  ["x", "y"],
]

[[rules.lhs.var_guards]]
type = "vars_distinct"
vars = ["x", "y"]

[[rules.lhs.node_property_compares]]
var_a  = "x"
key_a  = 1
op     = "gte"
var_b  = "y"
key_b  = 1
offset = 50.0

[rules.rhs]
nodes = ["x", "y"]
edges = [
  ["x", "y"],
]

[[rules.rhs.property_effects]]
var   = "x"
key   = 1
op    = "subtract"
value = 25.0

[[rules.rhs.property_effects]]
var   = "y"
key   = 1
op    = "add"
value = 25.0
