[package]
name = "hg-train"
version = "0.1.0"
edition = "2021"

# The learning layer's outer loop (NN plan §2.2). Drives everything through
# hg-sim-core's rollout API and NEVER imports hg-engine — "only hg-sim-core
# imports hg-engine" (v4 §2.3) holds unchanged.

[lib]
name = "hg_train"
path = "src/lib.rs"

[[bin]]
name = "hg-train"
path = "src/main.rs"

[dependencies]
hg-cognition = { path = "../hg-cognition" }
hg-rules = { path = "../hg-rules" }
hg-sim-core = { path = "../hg-sim-core", features = ["cognition"] }
hg-schema = { path = "../hg-schema" }
hg-output = { path = "../hg-output" }
hg-observe = { path = "../hg-observe" }
hg-core = { path = "../hg-core" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rayon = { workspace = true }
nalgebra = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
csv = { workspace = true }
