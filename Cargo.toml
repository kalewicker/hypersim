[workspace]
resolver = "2"
members = [
    "crates/hg-core",
    "crates/hg-schema",
    "crates/hg-rules",
    "crates/hg-engine",
    "crates/hg-selfmod",
    "crates/hg-meta",
    "crates/hg-parallel",
    "crates/hg-observe",
    "crates/hg-output",
    "crates/hg-causal",
    "crates/hg-alife",
    "crates/hg-alphabet",
    "crates/hg-eval",
    "crates/hg-cognition",
    "crates/hg-train",
    "crates/hg-report",
    "crates/hg-app-api",
    "crates/hg-sim-core",
    "crates/hg-gui",
    "bins/hypersim-cli",
    "bins/hypersim",
]

[workspace.dependencies]
# Core
smallvec = { version = "1", features = ["union", "serde"] }
slotmap = { version = "1", features = ["serde"] }
rustc-hash = "1"
ahash = { version = "0.8", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
bincode = "1"

# Parallelism + concurrency
rayon = "1"
crossbeam-channel = "0.5"

# Engine / causal
petgraph = "0.6"
nalgebra = "0.33"
ascent = "0.7"

# Randomness (deterministic)
rand = "0.8"
rand_chacha = "0.3"

# Output
csv = "1.3"
chrono = "0.4"

# GUI (hg-gui only)
eframe = "0.30"
egui = "0.30"
egui_plot = "0.30"
rfd = "0.15"
syntect = "5"

# Misc
serde_json = "1.0"
num_cpus = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev dependencies
criterion = { version = "0.5", features = ["html_reports"] }
parking_lot = "0.12"
thiserror = "1.0"
tempfile = "3"
proptest = "1"
trybuild = "1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
opt-level = 3
lto = "thin"
debug = true
