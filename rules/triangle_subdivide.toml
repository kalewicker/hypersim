# Triangle subdivision rule
# A 3-node clique subdivides into 4 nodes with 6 edges

[[rules]]
name     = "triangle_subdivide"
priority = 1
weight   = 1.0
enabled  = true

[rules.lhs]
nodes = ["a", "b", "c"]
edges = [
  ["a", "b"],
  ["b", "c"],
  ["a", "c"],
]

[[rules.lhs.var_guards]]
type = "vars_distinct"
vars = ["a", "b", "c"]

[rules.rhs]
nodes = ["a", "b", "c", "d"]
edges = [
  ["a", "d"],
  ["b", "d"],
  ["c", "d"],
  ["a", "b"],
  ["b", "c"],
  ["a", "c"],
]

[rules.rhs.node_labels]
d = 0
