# lk_fuse.toml — the v4 F2 fuse rule: filament reabsorption. A degree-2,
# generation ≥ 1 midpoint w is removed and its endpoints rejoined; w's
# energy VANISHES with it, recorded per-event on the fused-energy ledger
# (audit: E_total + c·N_sub + Σ E_fused = E₀, exact — v4 §6.3).
#
# Scope (v4 §1.4, pre-declared): generation-guarded, so gen-0 original
# lattice edges and planted handles are NON-REMOVABLE BY DESIGN — fuse
# removes only emergent throats. Relaxing this is a v5 question.
#
# Anti-churn brake (v4 §7): priority LAST (-1, below transport 0 and
# subdivide 1 in the pump regime; the transport_first remap keeps it at
# -1) — subdivide wins conflicts while eligible, so in the pump regime
# fuse activates only at quench (growth era → reabsorption era). Churn
# (fuse-then-resubdivide at the same site) is MEASURED via the churn
# counter, never silently prevented.
#
# Degree guard semantics (v4 §6.2, pinned): degree = count of distinct
# incident hyperedges. Both guards carry engagement counters from birth
# (§1.1) — FG3 requires the generation guard's rejection counter to be
# nonzero on a clean lattice.
#
# f_cap throttle (v5 §1.3): `[lk_rules.fuse] f_cap` in the run config
# appends Guard `w.energy < f_cap` (STRICT `<`; a node at exactly f_cap
# is not fusable — FG5 pins the boundary) as prop1, after the
# generation guard's prop0. A fresh child carries exactly q, so with
# f_cap < q the guard is an AGING TIMER (t_age ≳ (q − f_cap)/τ). The
# guard is config-injected (runner load_rules), not declared here, so
# an unthrottled file-load of this rule is byte-unchanged from v4.

[[rules]]
name     = "lk_fuse"
priority = -1
weight   = 1.0
enabled  = true

[rules.lhs]
nodes = ["x", "w", "y"]
edges = [
  ["x", "w"],
  ["w", "y"],
]

[[rules.lhs.var_guards]]
type = "vars_distinct"
vars = ["x", "w", "y"]

[[rules.lhs.node_degree_compares]]
var   = "w"
op    = "eq"
value = 2

[[rules.lhs.node_property_guards]]
var      = "w"
property = 6
op       = "gte"
value    = 1.0

[rules.rhs]
nodes = ["x", "y"]
edges = [
  ["x", "y"],
]
